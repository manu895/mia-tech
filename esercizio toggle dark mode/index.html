<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toggle Dark Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white dark:bg-gray-800 text-black dark:text-white p-6">

    <h1 class="text-3xl font-bold text-center">Modalità Chiara e Scura</h1>
    <p class="text-center">Clicca sul pulsante per alternare modalità.</p>

    <div class="flex justify-center">
        <button onclick="toggleDarkMode()" class="bg-blue-500 text-white p-2 rounded-full">Alterna Modalità</button>
    </div>


    <script src="script.js"></script>
</body>

</html>
