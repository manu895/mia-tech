<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tema personalizzato</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
   
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            customBlue: '#1e40af',  
            customYellow: '#f59e0b'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 p-6">

  <div class="bg-customBlue text-customYellow p-6 rounded shadow">
    <h1 class="text-3xl font-bold text-center">Tema Personalizzato</h1>
    <p class="text-center">
      Questo è un esempio di tema personalizzato usando Tailwind
    </p>
  </div>

</body>
</html>
