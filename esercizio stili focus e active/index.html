<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stili focus & active</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-4">
    <div class="max-w-md mx-auto">
        <label for="nome" class="block text-sm font-medium text-gray-700">Nome:</label>
        <input type="text" id="nome"
            class="mt-1 p-2 w-full border rounded-md focus:ring focus:ring-blue-300 focus:border-blue-300 active:bg-gray-100">

        <label for="cognome" class="block mt-4 text-sm font-medium text-gray-700">Cognome:</label>
        <input type="text" id="cognome"
            class="mt-1 p-2 w-full border rounded-md focus:ring focus:ring-blue-300 focus:border-blue-300 active:bg-gray-100">

        <button class="mt-4 p-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 focus:outline-none focus:ring focus:ring-blue-300 active:bg-blue-700">Invia</button>
    </div>
</body>

</html>
