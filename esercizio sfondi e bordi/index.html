<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colore di Sfondo e Bordo Personalizzati</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        customBlue: '#1e40af',
                        customGreen: '#10b981',
                        customRed: '#ef4444',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 p-6">

    <div class="space-y-4">
        <div class="bg-customBlue text-white p-4 rounded-lg border-4 border-customGreen">
            Card 1
        </div>
        <div class="bg-customRed text-white p-4 rounded-lg border-4 border-customGreen">
            Card 2
        </div>
        <div class="bg-customGreen text-white p-4 rounded-lg border-4 border-customBlue">
            Card 3
        </div>
    </div>

</body>

</html>
