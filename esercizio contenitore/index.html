<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout con flex</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-4">
    <div class="flex flex-row">
        <div class="flex-1 bg-blue-200 p-4 border border-blue-400">
            Colonna 1
        </div>
        <div class="flex-1 bg-green-200 p-4 border border-green-400">
            Colonna 2
        </div>
        <div class="flex-1 bg-yellow-200 p-4 border border-yellow-400">
            Colonna 3
        </div>
    </div>

    <div class="flex flex-col mt-4">
        <div class="bg-red-200 p-4 border border-red-400">
            Elemento 1
        </div>
        <div class="bg-purple-200 p-4 border border-purple-400">
            Elemento 2
        </div>
        <div class="bg-pink-200 p-4 border border-pink-400">
            Elemento 3
        </div>
    </div>
</body>

</html>
