<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione LocalStorage</title>
</head>
<body>

    <h1>Gestione LocalStorage</h1>
    <button onclick="saveToLocalStorage('nome', 'Manu')">Salva Nome</button>
    <button onclick="getFromLocalStorage('nome')">Recupera Nome</button>
    <button onclick="removeFromLocalStorage('nome')">Rimuovi Nome</button>

    <script src="index.js"></script>

</body>
</html>
