<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulsanti con Hover</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6">

  <div class="flex flex-col space-y-4 items-center">
    
    <button class="bg-blue-500 text-white p-3 rounded-full hover:bg-blue-700">
      Pulsante 1
    </button>

    
    <button class="bg-green-500 text-white p-3 rounded-full hover:opacity-75">
      Pulsante 2
    </button>

   
    <button class="bg-transparent text-blue-500 border-2 border-blue-500 p-3 rounded-full hover:bg-blue-500 hover:text-white">
      Pulsante 3
    </button>

    
    <button class="bg-purple-500 text-white p-3 rounded-full transform hover:scale-110">
      Pulsante 4
    </button>
  </div>

</body>
</html>
